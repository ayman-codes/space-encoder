name: eos

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: eos-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5001:5000"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,[[]::1],[[]::1]:*,mlflow,mlflow:*,10.*,192.168.*,172.1[6-9].*,172.2[0-9].*,172.3[01].*,fc00:*,fd00:*"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1
    container_name: eos-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: eos-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - pushgateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    container_name: eos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  eos-gpu:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.rocm
    image: eos-rocm:10.1.0
    container_name: eos-gpu
    ipc: host
    shm_size: "16gb"
    devices:
      - /dev/dxg
    volumes:
      - ..:/workspace
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    environment:
      PYTHONPATH: /workspace/src
      PYTHONUTF8: "1"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
      PROMETHEUS_URL: http://prometheus:9090
      HF_HOME: /workspace/.cache/huggingface
      TORCH_HOME: /workspace/.cache/torch
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-eos}
    ports:
      - "8888:8888"
    working_dir: /workspace
    command:
      - uv
      - run
      - --no-sync
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=${JUPYTER_TOKEN:-eos}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
