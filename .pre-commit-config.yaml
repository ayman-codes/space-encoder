exclude: ^(references|data|\.cache|\.uv-cache|\.venv|\.dvc|mlruns|reports|checkpoints|\.vscode)/

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, jupyter]
        require_serial: true

      - id: contract-gate
        name: contract gate (comments, docstrings, configs)
        entry: uv run python scripts/validate_contracts.py
        language: system
        pass_filenames: false

      - id: mypy-strict
        name: mypy strict
        entry: uv run mypy
        language: system
        pass_filenames: false

      - id: pytest-fast
        name: pytest fast subset
        entry: uv run pytest -q -m "not gpu and not slow and not integration"
        language: system
        pass_filenames: false
