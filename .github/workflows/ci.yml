name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  quality-gate:
    name: Lint, types, contracts, tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('src/**/*.py', 'scripts/**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check src scripts tests notebooks

      - name: Ruff lint
        run: uv run ruff check src scripts tests notebooks

      - name: Contract gate
        run: uv run python scripts/validate_contracts.py

      - name: Mypy strict
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov
